# ScriptumIQ on a Hostinger VPS: app (web + scheduler) + Postgres + render container.
# Every secret comes from the host environment (Hostinger's env config or a root .env that is
# never committed). See docs/DEPLOY.md.
#
# The project keeps the product's old name, and so do the database's user and name below. The
# volumes are named after the project (daymarkable_pgdata, daymarkable_dmstate): rename it and
# Compose starts a new, EMPTY database beside the real one, and every account appears gone. Only
# the operator ever sees these names.
name: daymarkable

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daymarkable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the host environment}
      POSTGRES_DB: ${POSTGRES_DB:-daymarkable}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daymarkable} -d ${POSTGRES_DB:-daymarkable}"]
      interval: 10s
      timeout: 5s
      retries: 10

  render:
    build: ./services/render
    restart: unless-stopped
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      render:
        condition: service_started
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?set APP_URL, e.g. https://scriptumiq.com}
      SERVICE_URL: ${SERVICE_URL:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-daymarkable}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-daymarkable}
      RENDER_SERVICE_URL: http://render:8787
      DAYMARKABLE_STATE_DIR: /data
      # Settable from .env so the automatic run can be disarmed without a code change — which is
      # what you want at 1am when a run is doing something wrong and you need it to stop tonight.
      # Sync now is unaffected; only the scheduled run reads this.
      DAYMARKABLE_SCHEDULER: "${DAYMARKABLE_SCHEDULER:-1}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY (32 bytes base64)}
      DECODE_MODEL: ${DECODE_MODEL:-claude-sonnet-5}
      DECODE_ESCALATION_MODEL: ${DECODE_ESCALATION_MODEL:-claude-opus-5}
      DECODE_MODEL_ROTATION: ${DECODE_MODEL_ROTATION:-}
      DECODE_CONFIDENCE_THRESHOLD: ${DECODE_CONFIDENCE_THRESHOLD:-0.7}
      # The brief and the crossword's words, NOT the decoder (CLAUDE.md "Model usage"). The code
      # already defaults to Haiku 4.5, so production was on the right model — but the knob was dead
      # until it was named here, because this list is the whole of what reaches the container.
      NEWS_MODEL: ${NEWS_MODEL:-}
      # A nightly batch that has not ended by then is cancelled and re-sent at standard price,
      # so a slow batch costs a few cents instead of the night's notebooks.
      DECODE_BATCH_TIMEOUT_MINUTES: ${DECODE_BATCH_TIMEOUT_MINUTES:-45}
      # Per-call deadline for the reMarkable cloud, which sometimes answers a connection and
      # then goes quiet, plus backoff for its 429s when a run does its uploads back to back.
      RMAPI_TIMEOUT_MS: ${RMAPI_TIMEOUT_MS:-120000}
      RMAPI_ATTEMPTS: ${RMAPI_ATTEMPTS:-5}
      RMAPI_BACKOFF_MS: ${RMAPI_BACKOFF_MS:-3000}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      # The address stays on daymarkable.com until scriptumiq.com is verified with Resend: sign-in is
      # by emailed link, so an unverified sender locks every account out (mail/provider.ts).
      EMAIL_FROM: ${EMAIL_FROM:-ScriptumIQ <notes@daymarkable.com>}
      # Inbound invites (rule 17). The HOST is the subdomain the forwarding address is built from.
      #
      # Two secrets, because there are two ways in and they authenticate differently.
      # INBOUND_CALENDAR_SECRET is the shared header on /api/inbound/calendar, which takes a raw
      # message and suits anything that can set its own headers — a Cloudflare Worker, an SES Lambda.
      # Resend cannot use it: its webhooks carry a Svix signature and no configurable headers, and
      # the payload is metadata rather than the message. So the Resend adapter verifies
      # RESEND_WEBHOOK_SECRET instead, a whsec_ value Resend generates and shows ONCE.
      # Either secret left empty refuses every message on its own route, which is the right default:
      # both are open to the internet and an unset secret should mean shut, not open.
      INBOUND_CALENDAR_HOST: ${INBOUND_CALENDAR_HOST:-}
      INBOUND_CALENDAR_SECRET: ${INBOUND_CALENDAR_SECRET:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      USER_EMAIL: ${USER_EMAIL:?set USER_EMAIL (the registered login address)}
      USER_TIMEZONE: ${USER_TIMEZONE:-America/New_York}
      RMAPI_DEVICE_TOKEN: ${RMAPI_DEVICE_TOKEN:-}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      # Billing, Phase 2. Empty until it ships, which leaves the payment routes switched off.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - dmstate:/data
    ports:
      - "127.0.0.1:3000:3000"

  # Optional HTTPS edge. Start with `docker compose --profile edge up -d` once APP_DOMAIN points at the VPS.
  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN, e.g. scriptumiq.com (Caddy also serves app. and redirects www.)}
      # The product's previous domain, redirected (and /api/* proxied) to APP_DOMAIN. Set by
      # scripts/vps-upgrade.sh when it moves APP_DOMAIN. The .localhost default is deliberate —
      # see the Caddyfile: it must never equal APP_DOMAIN, or Caddy will not start.
      LEGACY_DOMAIN: ${LEGACY_DOMAIN:-legacy.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  dmstate:
  caddy_data:
  caddy_config:
